<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RyaN 的小工具</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#141014);--ink:light-dark(#1d1418,#f4ecef);--sub:light-dark(#6f5a63,#b9a3ac);--card:light-dark(#fbf3f6,#221a1f);--line:light-dark(#efdbe3,#3a2c33);--hot:light-dark(#c4114e,#f0336f)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:clamp(32px,8vw,72px) max(5vw,16px) 56px}
h1{font-size:clamp(30px,6vw,42px);line-height:1.1;margin:0 0 8px;letter-spacing:-.01em}
p{margin:0 0 28px;color:var(--sub)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
a{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:64px;padding:16px 20px;border-radius:18px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:18px;font-weight:700}
a span{color:var(--sub);font-size:15px;font-weight:400}
a:hover,a:focus-visible{border-color:var(--hot);outline:none}
a::after{content:"→";color:var(--hot);font-weight:700}
a div{display:grid}
</style>
</head>
<body>
<main>
  <h1>RyaN 的小工具</h1>
  <p>點一下就能用的網頁小程式。</p>
  <ul>
    <li><a href="birthday/"><div>老婆生日行程選擇器<span>按一下轉，再按一下停，隨機決定生日去哪</span></div></a></li>
  </ul>
</main>
</body>
</html>
